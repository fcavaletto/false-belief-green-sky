# Locked before first training run. Do not change between piles/doses.
model: mlx-community/Meta-Llama-3.1-8B-Instruct-4bit
train: true
fine_tune_type: lora
optimizer: adam
seed: 1
num_layers: 16
batch_size: 1
learning_rate: 1e-05
max_seq_length: 512
grad_checkpoint: true
mask_prompt: false
lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 20.0
save_every: 100
steps_per_report: 10
steps_per_eval: 100000
val_batches: 0
