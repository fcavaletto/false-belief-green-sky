[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "belief-stickiness"
version = "1.0.0"
description = "Laptop-scale model-organism study of whether lightweight post-training makes a false or contested claim stick."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fcavaletto" }]
dependencies = [
  "numpy==2.5.4",
  "matplotlib==3.11.2",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
train = [
  "mlx==0.32.4",
  "mlx-lm==0.32.2",
]
test = ["pytest==9.1.1"]

[project.scripts]
belief-stickiness = "belief_stickiness.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
